name: Run Agent Pipeline

on:
  schedule:
    - cron: "0 0,4,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install groq fpdf2 python-docx

      - name: Run Agent Script
        run: python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Generate report
        if: always()
        run: python agent.py --report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload books
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: books
          path: books/
          if-no-files-found: warn

      - name: Upload fleet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-report
          path: fleet-report.md
          if-no-files-found: warn

      - name: Save books and report to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add books fleet-report.md || true
          git diff --cached --quiet || git commit -m "Add generated books and fleet report"
          git push || true
