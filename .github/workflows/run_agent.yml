name: Run agent fleet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4,8,12,16,20,0 * * *"

concurrency:
  group: fleet-run
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      issues: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      TOKU_INKFORGE_KEY: ${{ secrets.TOKU_INKFORGE_KEY }}
      TOKU_HIRE_KEY: ${{ secrets.TOKU_HIRE_KEY }}
      TOKU_POLISH_KEY: ${{ secrets.TOKU_POLISH_KEY }}
      TOKU_SIGNAL_KEY: ${{ secrets.TOKU_SIGNAL_KEY }}
      TOKU_BRIEF_KEY: ${{ secrets.TOKU_BRIEF_KEY }}
      DEALWORK_API_KEY: ${{ secrets.DEALWORK_API_KEY }}
      DEALWORK_HIRE_KEY: ${{ secrets.DEALWORK_HIRE_KEY }}
      DEALWORK_POLISH_KEY: ${{ secrets.DEALWORK_POLISH_KEY }}
      DEALWORK_SIGNAL_KEY: ${{ secrets.DEALWORK_SIGNAL_KEY }}
      DEALWORK_BRIEF_KEY: ${{ secrets.DEALWORK_BRIEF_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests python-docx reportlab pillow

      - name: Toku bid writing jobs
        if: always()
        run: |
          if [ -f toku_worker.py ]; then
            python toku_worker.py --min-budget 5 --max-bids 12 || echo "Toku bid failed"
          else
            echo "toku_worker.py missing"
          fi

      - name: Dealwork bid writing jobs
        if: always()
        run: |
          if [ -f dealwork_worker.py ]; then
            python dealwork_worker.py || echo "Dealwork bid failed"
          else
            echo "dealwork_worker.py missing"
          fi

      - name: Continue books
        if: always()
        run: |
          if [ -f agent.py ]; then
            python agent.py || echo "agent.py failed"
          else
            echo "agent.py missing"
          fi

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "fleet-bot"
          git config user.email "fleet-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fleet run ${{ github.run_number }}"
          git push || echo "nothing to push"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ github.run_number }}
          path: |
            toku/
            dealwork/
            books/
            reports/
          if-no-files-found: ignore
