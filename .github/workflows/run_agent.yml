name: Run Agent

on:
  workflow_dispatch:
  schedule:
    # Runs 5 times a day mapped to Eastern Time hours
    - cron: '0 0,12,15,18,21 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Full Agent Fleet Run (Eastern Time)
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
        run: |
          python3 -c '
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          
          # Force Eastern Time (Tampa) for execution logging
          eastern_tz = ZoneInfo("America/New_York")
          local_time = datetime.now(timezone.utc).astimezone(eastern_tz)
          timestamp_str = local_time.strftime("%Y-%m-%d %H:%M %Z")
          
          print("==========================================")
          print(f"🚀 Agent Fleet Run Started at: {timestamp_str}")
          print("==========================================")
          print("Environment Status:")
          print("- You.com API Key:", bool(os.environ.get("YOU_API_KEY")))
          print("- Firecrawl API Key:", bool(os.environ.get("FIRECRAWL_API_KEY")))
          print("- Lemon Squeezy Store ID:", bool(os.environ.get("LEMONSQUEEZY_STORE_ID")))
          '
          
          # Uncomment below once your main orchestrator script is named agent.py or runner.py
          # python3 agent.py
