name: Force Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install openai fpdf2 python-docx requests

      - name: Cleanup + status + report
        run: |
          python agent.py --cleanup || true
          python agent.py --status || true
          python agent.py --report
          ls -l fleet-report.md book-status.md

      - name: Save reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          touch fleet-report.md book-status.md
          git add fleet-report.md book-status.md books || true
          git diff --cached --quiet || git commit -m "Force fleet report"
          git push || true
