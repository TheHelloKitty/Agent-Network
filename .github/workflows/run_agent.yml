name: Run Agent Network

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Swarm Execution
        run: python agent.py

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "Talos Bot"
          git config --global user.name "actions@github.com"
          git add agent_outputs/ swarm_memory.json
          git diff --staged --quiet || git commit -m "chore: automated agent generation and memory sync [skip ci]"
          git push
