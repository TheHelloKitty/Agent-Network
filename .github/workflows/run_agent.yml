name: Run Agent Network

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Swarm Execution
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          TOGETHER: ${{ secrets.TOGETHER }}
        run: python agent.py

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "Talos Bot"
          git config --global user.email "actions@github.com"
          git add agent_outputs/ swarm_memory.json
          git diff --staged --quiet || git commit -m "chore: automated agent generation and memory sync [skip ci]"
          git push

      - name: Open Notification Issue for Swarm Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count active outputs to put in the issue body
          TOTAL_AGENTS=$(ls -1 agent_outputs/ | wc -l)
          gh issue create \
            --title "🤖 Swarm Update: New Generation Executed Successfully" \
            --body "The multi-generational agent network just completed a run. Total active agents/assets tracked in repository: **$TOTAL_AGENTS**."
