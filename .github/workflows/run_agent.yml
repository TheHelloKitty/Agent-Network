      - name: Run Agent with Eastern Time
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
        run: |
          python3 -c '
          import os
          print("Lemon Squeezy Store ID loaded:", bool(os.environ.get("LEMONSQUEEZY_STORE_ID")))
          '
