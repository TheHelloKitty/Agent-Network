name: Run Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Agent with Eastern Time
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 -c '
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          
          eastern_tz = ZoneInfo("America/New_York")
          local_time = datetime.now(timezone.utc).astimezone(eastern_tz)
          timestamp_str = local_time.strftime("%Y-%m-%d %H:%M %Z")
          
          print(f"Agent Run Triggered at: {timestamp_str}")
          '
