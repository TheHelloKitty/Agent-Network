name: Run Agent

on:
  workflow_dispatch:
  schedule:
    # Runs 5 times a day mapped to Eastern Time
    - cron: '0 0,12,15,18,21 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Full Agent Fleet Run
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
        run: |
          # Replace 'agent.py' with your primary orchestration script file name if different
          python3 agent.py
