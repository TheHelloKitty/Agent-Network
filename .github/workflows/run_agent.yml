name: Run Agent Network

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for Kairo'
        required: false
        default: 'Provide quick strategic advice for today.'
  schedule:
    - cron: '15 3,11,19 * * *'

permissions: write-all

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests upload-post coinbase-advanced-py

      - name: Execute Agent Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
          USER_PROMPT: ${{ github.event.inputs.prompt || 'Daily scheduled check-in and task review.' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent.py

      - name: Commit & Push Memory Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add memory.json
          git commit -m "Auto-update agent memory state" || echo "No memory changes to commit"
          git push
