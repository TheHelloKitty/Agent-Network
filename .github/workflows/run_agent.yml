name: 4-Hour Agent Report

on:
  schedule:
    # 8am, 12pm, 4pm, 8pm, 12am Eastern
    - cron: "0 0,4,12,16,20 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        run: python report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: reports/
