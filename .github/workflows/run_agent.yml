      - name: Run Agent Script
        run: python agent.py
        
      - name: Commit and push changes manually
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_outputs/ fleet-report.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Autonomous Agent Network: Automated Fleet Report Update"
          git push
