name: Agent Swarm Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cdp-sdk

      - name: Run Swarm Execution
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          CDP_API_SECRET: ${{ secrets.CDP_API_SECRET }}
        run: |
          python agent.py

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add swarm_memory.json agent_outputs/ storefront_exports/ issue_body.txt
          git commit -m "🤖 Swarm Update: Generated New Generation Assets and Report" || echo "No changes to commit"
          git push

      - name: Open Notification Issue for Swarm Run
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🤖 Swarm Update: New Generation Executed Successfully"
          content-filepath: "issue_body.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
