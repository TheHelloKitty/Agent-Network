name: Register Spin Agents

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run agent registration script
        env:
          TOKU_API_KEY: ${{ secrets.TOKU_API_KEY }}
        run: python register_spin_agents.py
